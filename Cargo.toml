[workspace]
resolver = "2"
members = [
    "apps/desktop",
    "crates/langmuir-core",
    "crates/langmuir-storage",
    "crates/langmuir-transport",
    "tools/protocol-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
chrono = { version = "0.4.41", default-features = false, features = ["clock", "std"] }
crossbeam-channel = "0.5.15"
eframe = { version = "0.35.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_plot = "0.36.0"
parking_lot = "0.12.4"
rand = "0.9.2"
serialport = { version = "4.9.0", default-features = false }
skrifa = "0.42.1"
tempfile = "3.20.0"
thiserror = "2.0.12"
sha2 = "0.10.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
