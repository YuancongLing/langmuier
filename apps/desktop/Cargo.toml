[package]
name = "langmuir-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "langmuier"
path = "src/main.rs"

[features]
default = []
hdf5 = ["langmuir-storage/hdf5"]
hdf5-static = ["langmuir-storage/hdf5-static"]
mock = ["langmuir-transport/mock"]

[dependencies]
chrono.workspace = true
crossbeam-channel.workspace = true
eframe.workspace = true
egui_plot.workspace = true
langmuir-core = { path = "../../crates/langmuir-core" }
langmuir-storage = { path = "../../crates/langmuir-storage", default-features = false }
langmuir-transport = { path = "../../crates/langmuir-transport" }
skrifa.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
rfd = { version = "0.15", default-features = false }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
